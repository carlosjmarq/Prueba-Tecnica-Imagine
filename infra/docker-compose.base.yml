# Servicios base de desarrollo: PostgreSQL + MinIO (S3 local)
# Uso:  docker compose -f infra/docker-compose.base.yml up -d
# Documentacion: docs/40 Proceso/Setup y herramientas.md
name: imagine-delivery-infra
services:
  postgres:
    image: postgres:16-alpine
    container_name: imagine-delivery-postgres
    environment:
      POSTGRES_USER: imagine_delivery
      POSTGRES_PASSWORD: imagine_delivery_dev
      POSTGRES_DB: imagine_delivery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagine_delivery -d imagine_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: imagine-delivery-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata: