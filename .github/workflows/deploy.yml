name: CD

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: delivery-api

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'

  build-backend:
    name: Build y push a ECR
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Asegurar repositorio ECR
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true >/dev/null
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build y push de la imagen
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$IMAGE_TAG" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"

  deploy-infra:
    name: Tofu plan y apply
    needs: [changes, build-backend]
    if: >-
      always() &&
      needs.changes.outputs.infra == 'true' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
      TF_VAR_sns_email: ${{ secrets.TF_SNS_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - name: Empaquetar Lambda
        working-directory: infra/functions/order_timeout_canceller
        run: |
          rm -rf package && mkdir -p package
          python -m pip install --no-cache-dir -r requirements.txt --target package
          cp lambda_function.py package/
      - name: Tofu init
        run: tofu init
      - name: Tofu plan
        run: tofu plan -input=false -lock-timeout=5m -out=tfplan
      - name: Tofu apply
        run: tofu apply -input=false -auto-approve tfplan
